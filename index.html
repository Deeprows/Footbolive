<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Deeprowss Football Live and Highlights."
  >

  <meta
    name="theme-color"
    content="#07090d"
  >

  <title>Deeprowss Football</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header class="site-header">

    <div class="container nav-wrap">

      <a
        class="brand"
        href="index.html"
        aria-label="Deeprowss Home"
      >

        <span class="brand-mark">
          D
        </span>

        <span>
          DEE<span>PROWSS</span>
        </span>

      </a>


      <button
        type="button"
        class="menu-toggle"
        id="menuToggle"
        aria-label="Open navigation"
        aria-expanded="false"
        aria-controls="mainNav"
      >
        ☰
      </button>


      <nav
        class="main-nav"
        id="mainNav"
        aria-label="Main navigation"
      >

        <a
          href="#"
          id="navFootball"
          class="active"
        >
          Football Live
        </a>

        <a
          href="#"
          id="navHighlights"
        >
          Highlights
        </a>

      </nav>

    </div>

  </header>



  <!-- =========================================================
       MAIN APP
       ========================================================= -->

  <main class="football-app">


    <!-- =======================================================
         SCREEN
         ======================================================= -->

    <section
      class="screen-section"
      id="screenSection"
    >

      <div class="container">

        <div
          class="screen-player"
          id="screenPlayer"
        >


          <!-- SCREEN STATUS -->

          <div class="screen-status">

            <span class="screen-live-dot"></span>

            <span id="screenStatus">
              READY
            </span>

          </div>


          <!-- VIDEO / STREAM SCREEN -->

          <iframe
            id="screenFrame"
            src="about:blank"
            title="Deeprowss Football Screen"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
            referrerpolicy="no-referrer"
          ></iframe>


          <!-- SCREEN PLACEHOLDER -->

          <div
            class="screen-placeholder"
            id="screenPlaceholder"
          >

            <div class="screen-placeholder-icon">
              ⚽
            </div>

            <strong>
              Select a match
            </strong>

          </div>


          <!-- SCREEN INFORMATION -->

          <div class="screen-bottom">

            <div class="now-showing">

              <span>
                NOW SHOWING
              </span>

              <strong id="nowShowing">
                Select a match
              </strong>

            </div>


            <button
              type="button"
              class="fullscreen-button"
              id="fullscreenButton"
              aria-label="Fullscreen"
            >
              ⛶
            </button>

          </div>


        </div>

      </div>

    </section>



    <!-- =======================================================
         MAIN TWO BUTTONS
         ======================================================= -->

    <section
      class="app-menu"
      id="appMenu"
    >

      <div class="container">

        <div class="app-buttons">


          <!-- FOOTBALL LIVE -->

          <button
            type="button"
            class="app-button football-button active"
            id="footballButton"
          >

            <span class="app-button-icon">
              ⚽
            </span>

            <span>
              Football Live
            </span>

          </button>


          <!-- HIGHLIGHTS -->

          <button
            type="button"
            class="app-button highlights-button"
            id="highlightsButton"
          >

            <span class="app-button-icon">
              🎬
            </span>

            <span>
              Highlights
            </span>

          </button>


        </div>

      </div>

    </section>



    <!-- =======================================================
         FOOTBALL LIVE
         ======================================================= -->

    <section
      class="content-section"
      id="footballContent"
    >

      <div class="container">


        <div class="content-heading">

          <h1>
            Upcoming &amp; Live Matches
          </h1>

          <span
            class="content-count"
            id="matchCount"
          >
            1
          </span>

        </div>


        <div
          class="match-grid"
          id="matchList"
        >


          <!-- =================================================
               CHELSEA VS JUVENTUS
               ================================================= -->

          <button
            type="button"
            class="match-card"
            data-name="Chelsea vs Juventus"
            data-url="https://filemoon.org/en/E1x3AqDe3yk6/embed"
          >

            <span class="match-status live">
              LIVE
            </span>

            <span class="match-teams">
              Chelsea vs Juventus
            </span>

            <span class="match-time">
              Live
            </span>

          </button>


        </div>


        <div
          class="empty-state"
          id="footballEmpty"
          hidden
        >
          No matches available.
        </div>


      </div>

    </section>



    <!-- =======================================================
         HIGHLIGHTS
         ======================================================= -->

    <section
      class="content-section highlights-content"
      id="highlightsContent"
      hidden
    >

      <div class="container">


        <div class="content-heading">

          <h1>
            Football Highlights
          </h1>

          <span
            class="content-count"
            id="highlightCount"
          >
            1
          </span>

        </div>


        <div
          class="highlight-grid"
          id="highlightList"
        >


          <!-- =================================================
               CHELSEA VS JUVENTUS HIGHLIGHT
               ================================================= -->

          <button
            type="button"
            class="highlight-card"
            data-name="Chelsea vs Juventus Highlights"
            data-url="https://filemoon.org/en/LJlGnPwv315w/embed"
          >

            <div class="highlight-thumbnail">

              <span>
                ▶
              </span>

            </div>

            <strong>
              Chelsea vs Juventus
            </strong>

            <small>
              Highlights
            </small>

          </button>


        </div>


        <div
          class="empty-state"
          id="highlightEmpty"
          hidden
        >
          No highlights available.
        </div>


      </div>

    </section>


  </main>



  <!-- =========================================================
       FOOTER
       ========================================================= -->

  <footer class="footer">

    <div class="container footer-wrap">

      <strong>
        DEE<span>PROWSS</span>
      </strong>

      <span>
        Football • Highlights
      </span>

    </div>

  </footer>



  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script src="script.js"></script>


</body>

</html>
