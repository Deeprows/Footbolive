<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Football live matches, highlights and streaming screen."
  >

  <meta
    name="theme-color"
    content="#07090d"
  >

  <title>Football App</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================
       APP
  ========================== -->

  <div
    class="app"
    id="app"
  >


    <!-- =========================
         HOME PAGE
    ========================== -->

    <main
      class="page active"
      id="homePage"
    >

      <div class="home-container">


        <!-- APP LOGO -->

        <div class="app-logo">
          ⚽
        </div>


        <h1>
          Football
        </h1>


        <!-- MAIN BUTTONS -->

        <div class="home-buttons">


          <!-- SCREEN -->

          <button
            type="button"
            class="main-button"
            onclick="openScreen()"
          >

            <span class="button-icon">
              📺
            </span>

            <span>
              Screen
            </span>

          </button>


          <!-- FOOTBALL -->

          <button
            type="button"
            class="main-button"
            onclick="openFootball()"
          >

            <span class="button-icon">
              ⚽
            </span>

            <span>
              Football Live | Highlights
            </span>

          </button>


        </div>

      </div>

    </main>



    <!-- =========================
         FOOTBALL PAGE
    ========================== -->

    <main
      class="page"
      id="footballPage"
    >


      <!-- HEADER -->

      <header class="page-header">


        <button
          type="button"
          class="back-button"
          onclick="goHome()"
          aria-label="Back"
          title="Back"
        >
          ‹
        </button>


        <h2>
          Football
        </h2>


      </header>



      <!-- TABS -->

      <nav
        class="football-tabs"
        aria-label="Football sections"
      >


        <!-- LIVE -->

        <button
          type="button"
          id="liveTab"
          class="football-tab active"
          onclick="showLive()"
        >

          ⚽ Live

        </button>


        <!-- HIGHLIGHTS -->

        <button
          type="button"
          id="highlightTab"
          class="football-tab"
          onclick="showHighlights()"
        >

          🎬 Highlights

        </button>


      </nav>



      <!-- =========================
           LIVE SECTION
      ========================== -->

      <section
        class="content-section active"
        id="liveSection"
      >


        <div class="section-title">
          Upcoming &amp; Live Matches
        </div>


        <div
          class="content-list"
          id="liveMatches"
        >
          <!-- JavaScript loads matches here -->
        </div>


      </section>



      <!-- =========================
           HIGHLIGHTS SECTION
      ========================== -->

      <section
        class="content-section"
        id="highlightSection"
      >


        <div class="section-title">
          Highlights
        </div>


        <div
          class="content-list"
          id="highlights"
        >
          <!-- JavaScript loads highlights here -->
        </div>


      </section>


    </main>



    <!-- =========================
         SCREEN PAGE
    ========================== -->

    <main
      class="page"
      id="screenPage"
    >


      <!-- HEADER -->

      <header class="page-header">


        <button
          type="button"
          class="back-button"
          onclick="goBackFromScreen()"
          aria-label="Back"
          title="Back"
        >
          ‹
        </button>


        <h2>
          Screen
        </h2>


      </header>



      <!-- SCREEN CONTAINER -->

      <div class="screen-container">


        <!-- =========================
             NOW SHOWING
        ========================== -->

        <div
          class="now-showing"
          aria-live="polite"
        >

          <span>
            Now showing:
          </span>

          <strong id="nowShowing">
            Select a match
          </strong>

        </div>



        <!-- =========================
             PLAYER
        ========================== -->

        <div
          class="screen-player"
          id="screenPlayer"
        >


          <!-- DEFAULT PLAYER PLACEHOLDER -->

          <div class="screen-placeholder">


            <div class="screen-icon">
              📺
            </div>


            <p>
              Select a match
            </p>


            <small>
              Player ready
            </small>


          </div>


        </div>


      </div>


    </main>


  </div>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script
    src="script.js"
    defer
  ></script>


</body>

</html>
