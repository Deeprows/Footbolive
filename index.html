<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Football Live, upcoming matches and football highlights."
  >

  <meta
    name="theme-color"
    content="#07090d"
  >

  <title>Football Live</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================
       APP
  ========================== -->

  <div class="app">


    <!-- =========================
         HOME PAGE
    ========================== -->

    <main
      id="homePage"
      class="page active"
    >

      <div class="home-container">


        <!-- APP LOGO -->

        <div class="app-logo">
          ⚽
        </div>


        <h1>
          Football
        </h1>


        <!-- MAIN BUTTONS -->

        <div class="home-buttons">


          <!-- SCREEN -->

          <button
            class="main-button screen-button"
            onclick="openScreen()"
            type="button"
          >

            <span class="button-icon">
              📺
            </span>

            <span>
              Screen
            </span>

          </button>


          <!-- FOOTBALL -->

          <button
            class="main-button football-button"
            onclick="openFootball()"
            type="button"
          >

            <span class="button-icon">
              ⚽
            </span>

            <span>
              Football Live | Highlights
            </span>

          </button>


        </div>

      </div>

    </main>



    <!-- =========================
         FOOTBALL PAGE
    ========================== -->

    <main
      id="footballPage"
      class="page"
    >


      <!-- PAGE HEADER -->

      <header class="page-header">


        <button
          class="back-button"
          onclick="goHome()"
          type="button"
          aria-label="Back"
        >
          ←
        </button>


        <h2>
          Football
        </h2>


      </header>



      <!-- =========================
           FOOTBALL TABS
      ========================== -->

      <nav
        class="football-tabs"
        aria-label="Football sections"
      >


        <!-- LIVE -->

        <button
          id="liveTab"
          class="football-tab active"
          onclick="showLive()"
          type="button"
        >

          🔴 Football Live

        </button>


        <!-- HIGHLIGHTS -->

        <button
          id="highlightTab"
          class="football-tab"
          onclick="showHighlights()"
          type="button"
        >

          🎬 Highlights

        </button>


      </nav>



      <!-- =========================
           LIVE SECTION
      ========================== -->

      <section
        id="liveSection"
        class="content-section active"
      >


        <div class="section-title">

          Upcoming & Live Matches

        </div>


        <!--
          JavaScript inserts
          football match cards here.
        -->

        <div
          id="liveMatches"
          class="content-list live-match-list"
        >

        </div>


      </section>



      <!-- =========================
           HIGHLIGHTS SECTION
      ========================== -->

      <section
        id="highlightSection"
        class="content-section"
      >


        <div class="section-title">

          Highlights

        </div>


        <!--
          JavaScript inserts
          highlight cards here.
        -->

        <div
          id="highlights"
          class="content-list highlight-list"
        >

        </div>


      </section>


    </main>



    <!-- =========================
         SCREEN PAGE
    ========================== -->

    <main
      id="screenPage"
      class="page"
    >


      <!-- SCREEN HEADER -->

      <header class="page-header">


        <button
          class="back-button"
          onclick="goBackFromScreen()"
          type="button"
          aria-label="Back"
        >
          ←
        </button>


        <h2>
          Screen
        </h2>


      </header>



      <!-- =========================
           SCREEN CONTAINER
      ========================== -->

      <section class="screen-container">


        <!-- =========================
             NOW SHOWING
        ========================== -->

        <div
          class="now-showing"
          aria-live="polite"
        >


          <span
            class="live-indicator"
            aria-hidden="true"
          >
            ●
          </span>


          <span>
            NOW SHOWING:
          </span>


          <strong id="nowShowing">
            Select a match
          </strong>


        </div>



        <!-- =========================
             PLAYER
        ========================== -->

        <div
          id="screenPlayer"
          class="screen-player"
        >


          <div class="screen-placeholder">


            <div
              class="screen-icon"
              aria-hidden="true"
            >
              📺
            </div>


            <p>
              Select a match to watch
            </p>


          </div>


        </div>


      </section>


    </main>


  </div>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="script.js"></script>


</body>

</html>
