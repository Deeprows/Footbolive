<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Deeprowss Football Live and Highlights."
  >

  <meta
    name="theme-color"
    content="#07090d"
  >

  <title>Football — Deeprowss</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header class="site-header">

    <div class="container nav-wrap">

      <a
        class="brand"
        href="index.html"
        aria-label="Deeprowss Home"
      >

        <span class="brand-mark">
          D
        </span>

        <span>
          DEE<span>PROWSS</span>
        </span>

      </a>


      <button
        type="button"
        class="menu-toggle"
        id="menuToggle"
        aria-label="Open navigation"
        aria-expanded="false"
        aria-controls="mainNav"
      >
        ☰
      </button>


      <nav
        class="main-nav"
        id="mainNav"
        aria-label="Main navigation"
      >

        <a
          href="#"
          id="navFootball"
          class="active"
        >
          Football Live
        </a>

        <a
          href="#"
          id="navHighlights"
        >
          Highlights
        </a>

      </nav>

    </div>

  </header>



  <!-- =========================================================
       MAIN APP
       ========================================================= -->

  <main class="football-app">


    <!-- =======================================================
         MAIN SCREEN
         ======================================================= -->

    <section
      class="screen-section"
      id="screenSection"
    >

      <div class="container">


        <div
          class="screen-player"
          id="screenPlayer"
        >

          <div class="screen-status">

            <span class="screen-live-dot"></span>

            <span id="screenStatus">
              READY
            </span>

          </div>


          <iframe
            id="screenFrame"
            src="about:blank"
            title="Deeprowss Football Screen"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
          ></iframe>


          <div
            class="screen-placeholder"
            id="screenPlaceholder"
          >

            <div class="screen-placeholder-icon">
              ⚽
            </div>

            <strong>
              Select a match
            </strong>

          </div>


          <div class="screen-bottom">

            <div class="now-showing">

              <span>
                NOW SHOWING
              </span>

              <strong id="nowShowing">
                Select a match
              </strong>

            </div>


            <button
              type="button"
              class="fullscreen-button"
              id="fullscreenButton"
              aria-label="Fullscreen"
            >
              ⛶
            </button>

          </div>

        </div>


      </div>

    </section>



    <!-- =======================================================
         HOME BUTTONS
         ======================================================= -->

    <section
      class="app-menu"
      id="appMenu"
    >

      <div class="container">


        <div class="app-buttons">


          <button
            type="button"
            class="app-button football-button active"
            id="footballButton"
          >

            <span class="app-button-icon">
              ⚽
            </span>

            <span>
              Football Live
            </span>

          </button>


          <button
            type="button"
            class="app-button highlights-button"
            id="highlightsButton"
          >

            <span class="app-button-icon">
              🎬
            </span>

            <span>
              Highlights
            </span>

          </button>


        </div>


      </div>

    </section>



    <!-- =======================================================
         FOOTBALL LIVE CONTENT
         ======================================================= -->

    <section
      class="content-section"
      id="footballContent"
    >

      <div class="container">


        <div class="content-heading">

          <h1>
            Upcoming &amp; Live Matches
          </h1>

          <span
            class="content-count"
            id="matchCount"
          >
            0
          </span>

        </div>


        <div
          class="match-grid"
          id="matchList"
        >


          <!-- MATCHES WILL BE ADDED HERE -->


          <button
            type="button"
            class="match-card"
            data-name="Chelsea vs Juventus"
            data-url=""
          >

            <span class="match-status live">
              LIVE
            </span>

            <span class="match-teams">
              Chelsea vs Juventus
            </span>

            <span class="match-time">
              Live
            </span>

          </button>


          <button
            type="button"
            class="match-card"
            data-name="Barcelona vs PSG"
            data-url=""
          >

            <span class="match-status upcoming">
              UPCOMING
            </span>

            <span class="match-teams">
              Barcelona vs PSG
            </span>

            <span class="match-time">
              Coming Soon
            </span>

          </button>


          <button
            type="button"
            class="match-card"
            data-name="Arsenal vs Liverpool"
            data-url=""
          >

            <span class="match-status upcoming">
              UPCOMING
            </span>

            <span class="match-teams">
              Arsenal vs Liverpool
            </span>

            <span class="match-time">
              Coming Soon
            </span>

          </button>


          <button
            type="button"
            class="match-card"
            data-name="Real Madrid vs Manchester City"
            data-url=""
          >

            <span class="match-status upcoming">
              UPCOMING
            </span>

            <span class="match-teams">
              Real Madrid vs Manchester City
            </span>

            <span class="match-time">
              Coming Soon
            </span>

          </button>


        </div>


        <div
          class="empty-state"
          id="footballEmpty"
          hidden
        >

          No matches available.

        </div>


      </div>

    </section>



    <!-- =======================================================
         HIGHLIGHTS CONTENT
         ======================================================= -->

    <section
      class="content-section highlights-content"
      id="highlightsContent"
      hidden
    >

      <div class="container">


        <div class="content-heading">

          <h1>
            Football Highlights
          </h1>

          <span
            class="content-count"
            id="highlightCount"
          >
            0
          </span>

        </div>


        <div
          class="highlight-grid"
          id="highlightList"
        >


          <!-- HIGHLIGHTS WILL BE ADDED HERE -->


          <button
            type="button"
            class="highlight-card"
            data-name="Chelsea vs Juventus Highlights"
            data-url=""
          >

            <div class="highlight-thumbnail">

              <span>
                ▶
              </span>

            </div>

            <strong>
              Chelsea vs Juventus
            </strong>

            <small>
              Highlights
            </small>

          </button>


          <button
            type="button"
            class="highlight-card"
            data-name="Barcelona vs PSG Highlights"
            data-url=""
          >

            <div class="highlight-thumbnail">

              <span>
                ▶
              </span>

            </div>

            <strong>
              Barcelona vs PSG
            </strong>

            <small>
              Highlights
            </small>

          </button>


          <button
            type="button"
            class="highlight-card"
            data-name="Arsenal vs Liverpool Highlights"
            data-url=""
          >

            <div class="highlight-thumbnail">

              <span>
                ▶
              </span>

            </div>

            <strong>
              Arsenal vs Liverpool
            </strong>

            <small>
              Highlights
            </small>

          </button>


          <button
            type="button"
            class="highlight-card"
            data-name="Real Madrid vs Manchester City Highlights"
            data-url=""
          >

            <div class="highlight-thumbnail">

              <span>
                ▶
              </span>

            </div>

            <strong>
              Real Madrid vs Manchester City
            </strong>

            <small>
              Highlights
            </small>

          </button>


        </div>


        <div
          class="empty-state"
          id="highlightEmpty"
          hidden
        >

          No highlights available.

        </div>


      </div>

    </section>


  </main>



  <!-- =========================================================
       FOOTER
       ========================================================= -->

  <footer class="footer">

    <div class="container footer-wrap">

      <strong>
        DEE<span>PROWSS</span>
      </strong>

      <span>
        Football • Highlights
      </span>

    </div>

  </footer>



  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script src="script.js"></script>


</body>

</html>
```
