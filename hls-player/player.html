<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Deeprowss Player</title>

  <link rel="stylesheet" href="player.css">
</head>

<body>

  <div class="player" id="player">

    <!-- =====================================================
         VIDEO
         ===================================================== -->

    <video
      id="video"
      playsinline
      preload="metadata"
      crossorigin="anonymous"
    ></video>


    <!-- =====================================================
         DARK OVERLAY
         ===================================================== -->

    <div
      class="player-overlay"
      id="playerOverlay"
    ></div>


    <!-- =====================================================
         D WATERMARK
         ===================================================== -->

    <div class="watermark">
      D
    </div>


    <!-- =====================================================
         LOADING
         ===================================================== -->

    <div
      class="loading-screen"
      id="loadingScreen"
    >
      <div class="loader"></div>

      <span>
        Loading stream...
      </span>
    </div>


    <!-- =====================================================
         ERROR
         ===================================================== -->

    <div
      class="error-screen"
      id="errorScreen"
      hidden
    >

      <div class="error-icon">
        ⚠
      </div>

      <strong>
        Stream unavailable
      </strong>

      <span id="errorMessage">
        Unable to load this stream.
      </span>

      <button
        type="button"
        id="retryButton"
      >
        ↻ Retry
      </button>

    </div>


    <!-- =====================================================
         TAP TO WATCH
         ===================================================== -->

    <div
      class="watch-overlay"
      id="watchOverlay"
    >

      <button
        type="button"
        class="watch-button"
        id="watchButton"
      >

        <span class="watch-icon">
          ▶
        </span>

        <span>
          Tap to Watch
        </span>

      </button>

    </div>


    <!-- =====================================================
         CENTER PLAY
         ===================================================== -->

    <button
      type="button"
      class="center-play"
      id="centerPlay"
      aria-label="Play"
    >
      ▶
    </button>


    <!-- =====================================================
         QUALITY MENU
         ===================================================== -->

    <div
      class="quality-menu"
      id="qualityMenu"
      hidden
    >

      <div class="quality-title">
        Quality
      </div>

      <button
        type="button"
        data-quality="-1"
        class="quality-option active"
      >
        Auto
      </button>

    </div>


    <!-- =====================================================
         CONTROLS
         ===================================================== -->

    <div
      class="controls"
      id="controls"
    >

      <!-- PLAY / PAUSE -->

      <button
        type="button"
        class="control-button"
        id="playButton"
        aria-label="Play"
      >
        ▶
      </button>


      <!-- BACKWARD 10 SECONDS -->

      <button
        type="button"
        class="control-button seek-button"
        id="backwardButton"
        aria-label="Back 10 seconds"
        title="Back 10 seconds"
      >
        ⏪
      </button>


      <!-- FORWARD 10 SECONDS -->

      <button
        type="button"
        class="control-button seek-button"
        id="forwardButton"
        aria-label="Forward 10 seconds"
        title="Forward 10 seconds"
      >
        ⏩
      </button>


      <!-- MUTE -->

      <button
        type="button"
        class="control-button"
        id="muteButton"
        aria-label="Mute"
      >
        🔊
      </button>


      <!-- VOLUME -->

      <div class="volume-container">

        <input
          type="range"
          id="volumeSlider"
          min="0"
          max="1"
          step="0.05"
          value="1"
          aria-label="Volume"
        >

      </div>


      <!-- SPACER -->

      <div class="controls-spacer"></div>


      <!-- QUALITY -->

      <button
        type="button"
        class="control-button quality-button"
        id="qualityButton"
        aria-label="Quality"
        title="Quality"
      >
        ⚙
      </button>


      <!-- FULLSCREEN -->

      <button
        type="button"
        class="control-button"
        id="fullscreenButton"
        aria-label="Fullscreen"
        title="Fullscreen"
      >
        ⛶
      </button>

    </div>

  </div>


  <!-- =======================================================
       HLS.JS
       ======================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>


  <!-- =======================================================
       PLAYER SCRIPT
       ======================================================= -->

  <script src="player.js"></script>

</body>
</html>
