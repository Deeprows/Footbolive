<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Deeprowss Player</title>

  <!-- =====================================================
       HLS.JS
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- =====================================================
       PLAYER CSS
       ===================================================== -->

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       PLAYER
       ===================================================== -->

  <div
    id="player"
    class="player"
  >

    <!-- ===================================================
         VIDEO
         =================================================== -->

    <video
      id="video"
      playsinline
      webkit-playsinline
      preload="auto"
      crossorigin="anonymous"
    ></video>


    <!-- ===================================================
         DARK VIDEO OVERLAY
         =================================================== -->

    <div
      class="player-overlay"
      aria-hidden="true"
    ></div>


    <!-- ===================================================
         DEEPROWSS WATERMARK
         =================================================== -->

    <div
      class="watermark"
      aria-hidden="true"
    >
      D
    </div>


    <!-- ===================================================
         LOADING SCREEN
         =================================================== -->

    <div
      id="loadingScreen"
      class="loading-screen"
    >

      <div
        class="loader"
        aria-hidden="true"
      ></div>

      <span>Loading...</span>

    </div>


    <!-- ===================================================
         TAP TO WATCH OVERLAY
         =================================================== -->

    <div
      id="watchOverlay"
      class="watch-overlay"
    >

      <button
        id="watchButton"
        class="watch-button"
        type="button"
      >

        <span
          class="watch-icon"
          aria-hidden="true"
        >
          ▶
        </span>

        <span>
          Tap to Watch
        </span>

      </button>

    </div>


    <!-- ===================================================
         CENTER PLAY BUTTON
         =================================================== -->

    <button
      id="centerPlay"
      class="center-play"
      type="button"
      aria-label="Play"
    >
      ▶
    </button>


    <!-- ===================================================
         QUALITY MENU
         =================================================== -->

    <div
      id="qualityMenu"
      class="quality-menu"
      hidden
    >

      <div class="quality-title">
        Quality
      </div>

      <!-- Quality options are added by JavaScript -->

    </div>


    <!-- ===================================================
         ERROR SCREEN
         =================================================== -->

    <div
      id="errorScreen"
      class="error-screen"
      hidden
    >

      <div
        class="error-icon"
        aria-hidden="true"
      >
        ⚠
      </div>

      <strong>
        Stream Error
      </strong>

      <span id="errorMessage">
        Unable to load this stream.
      </span>

      <button
        id="retryButton"
        type="button"
      >
        Retry
      </button>

    </div>


    <!-- ===================================================
         PLAYER CONTROLS
         =================================================== -->

    <div
      id="controls"
      class="controls"
    >

      <!-- PLAY / PAUSE -->

      <button
        id="playButton"
        class="control-button"
        type="button"
        aria-label="Play"
      >
        ▶
      </button>


      <!-- MUTE -->

      <button
        id="muteButton"
        class="control-button"
        type="button"
        aria-label="Mute"
      >
        🔊
      </button>


      <!-- VOLUME -->

      <div class="volume-container">

        <input
          id="volumeSlider"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
          aria-label="Volume"
        >

      </div>


      <!-- SPACER -->

      <div class="controls-spacer"></div>


      <!-- QUALITY -->

      <button
        id="qualityButton"
        class="control-button"
        type="button"
        aria-label="Video quality"
      >
        ⚙
      </button>


      <!-- FULLSCREEN -->

      <button
        id="fullscreenButton"
        class="control-button"
        type="button"
        aria-label="Fullscreen"
      >
        ⛶
      </button>

    </div>

  </div>


  <!-- =====================================================
       PLAYER JAVASCRIPT
       ===================================================== -->

  <script src="player.js"></script>

</body>
</html>
