}

android {
    namespace 'com.deeprows.football'
    compileSdk 35

    defaultConfig {
        applicationId 'com.deeprows.football'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
}
