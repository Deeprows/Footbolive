name: Notify subscribers
on:
  push:
    branches: [main]
    paths:
      - 'content/football/matches.json'
      - 'content/highlights/highlights.json'
      - 'content/movies/movies.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Send push notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/send-notification.js "New content on Deeprowss" "Check out the latest update!" "https://deeprows.github.io/Footbolive/"
